<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A2A5B"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"><title>Painel — BoraAÍ</title></head><body class="admin-body"><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="BoraAÍ"></a><span class="admin-label">PAINEL ADMINISTRATIVO</span><button id="logout" class="ghost-btn hidden">Sair</button></div></header><main class="admin-main container"><section id="loginCard" class="admin-login"><img src="assets/logo.svg" alt="BoraAÍ"><span class="eyebrow dark">ACESSO RESTRITO</span><h1>Painel administrativo</h1><p>Entre com a senha administrativa para gerenciar os comércios.</p><form id="loginForm"><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">Entrar</button><div id="loginError" class="form-error"></div></form></section><section id="dashboard" class="hidden"><div class="admin-head"><div><span class="eyebrow dark">GESTÃO</span><h1>Comércios</h1><p>Cadastre, edite, destaque ou desative estabelecimentos.</p></div><button id="newBusiness" class="primary-btn">+ Novo comércio</button></div><div id="stats" class="stats-grid"></div><div class="admin-card"><div class="admin-table-head"><h2>Estabelecimentos cadastrados</h2><input id="adminSearch" type="search" placeholder="Buscar..."></div><div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Categoria</th><th>Contato</th><th>Status</th><th>Ações</th></tr></thead><tbody id="businessRows"></tbody></table></div></div></section></main><div id="modal" class="modal hidden"><div class="modal-box"><button id="closeModal" class="modal-close">×</button><span class="eyebrow dark">CADASTRO</span><h2 id="modalTitle">Novo comércio</h2><form id="businessForm" class="business-form"><input type="hidden" id="businessId"><div class="form-grid"><label>Nome*<input id="name" required maxlength="100"></label><label>Categoria*<select id="category" required></select></label><label>Telefone<input id="phone" inputmode="tel"></label><label>WhatsApp<input id="whatsapp" inputmode="tel"></label><label class="full">Descrição<input id="desc" maxlength="220"></label><label class="full">Endereço<input id="address" maxlength="180"></label><label>Horário<input id="hours" maxlength="180"></label><label>Emoji/ícone<input id="emoji" maxlength="8" placeholder="🏪"></label><label>Instagram (URL)<input id="instagram" type="url"></label><label>Site (URL)<input id="website" type="url"></label><label class="full">Google Maps (URL)<input id="maps" type="url"></label></div><div class="check-row"><label><input id="featured" type="checkbox"> ⭐ Empresa em destaque</label><label><input id="active" type="checkbox" checked> Visível no BoraAÍ</label></div><div class="form-actions"><button type="button" id="cancelModal" class="secondary-btn">Cancelar</button><button class="primary-btn" type="submit">Salvar comércio</button></div><div id="formError" class="form-error"></div></form></div></div><script src="js/data.js"></script><script src="js/admin.js"></script></body></html>
